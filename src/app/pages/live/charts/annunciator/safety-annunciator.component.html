<section class="annunciator" aria-label="Safety alerts">
    <div class="annunciator-head">
        <span class="annunciator-title">Safety alerts</span>
        <span class="feed" [ngClass]="'feed--' + link">
            <span class="feed-dot"></span>{{ link === 'online' ? 'Sensors online' : link === 'connecting' ? 'Connecting…' : 'Sensors offline' }}
        </span>
    </div>

    <button type="button" class="lamp" *ngFor="let state of states; trackBy: trackByKind"
        [ngClass]="'lamp--' + state.severity" [class.is-active]="state.active"
        [class.is-unack]="state.active && !state.acknowledged" [class.is-stale]="link !== 'online'"
        (click)="onLampClick(state)"
        [attr.aria-label]="state.label + (state.active ? ' active' : ' normal')"
        [attr.title]="state.detail">
        <span class="lamp-indicator" aria-hidden="true"></span>
        <span class="lamp-body">
            <span class="lamp-label">{{ state.label }}</span>
            <span class="lamp-state" *ngIf="state.active">
                <span class="telemetry-value">{{ elapsed(state) }}</span>
                {{ state.acknowledged ? state.detail : 'Click to acknowledge' }}
            </span>
            <span class="lamp-state" *ngIf="!state.active">Normal</span>
        </span>
    </button>
</section>
