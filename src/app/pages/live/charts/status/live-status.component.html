<div class="status-container">
    <div *ngIf="status===true then status_on else status_off"></div>

    <ng-template #status_on>
        <span class="status-design on-status-design"><span class="status-led"></span>On</span>
    </ng-template>

    <ng-template #status_off>
        <span class="status-design off-status-design"><span class="status-led"></span>Off</span>
    </ng-template>
</div>
