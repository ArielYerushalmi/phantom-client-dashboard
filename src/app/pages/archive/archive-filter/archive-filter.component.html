<form class="query" (ngSubmit)="onLoad()" aria-label="Archive time range">
    <label class="field">
        <span class="field-label">From</span>
        <input class="ph-input" type="datetime-local" step="1" name="start" [(ngModel)]="inputStartTime"
            (ngModelChange)="onFieldsChanged()" [class.is-invalid]="previewState === 'invalid'" required>
    </label>
    <span class="query-arrow" aria-hidden="true">→</span>
    <label class="field">
        <span class="field-label">To</span>
        <input class="ph-input" type="datetime-local" step="1" name="end" [(ngModel)]="inputEndTime"
            (ngModelChange)="onFieldsChanged()" [class.is-invalid]="previewState === 'invalid'" required>
    </label>

    <div class="quick" role="group" aria-label="Quick ranges">
        <button type="button" class="quick-btn" *ngFor="let range of quickRanges"
            (click)="applyQuickRange(range)">{{ range.label }}</button>
    </div>

    <div class="preview" [ngClass]="'preview--' + previewState" role="status" aria-live="polite">
        <ng-container [ngSwitch]="previewState">
            <span *ngSwitchCase="'checking'">Checking archive…</span>
            <span *ngSwitchCase="'ready'"><strong class="telemetry-value">{{ previewFrames | number }}</strong> frames recorded</span>
            <span *ngSwitchCase="'empty'">No recorded data in this range</span>
            <span *ngSwitchCase="'invalid'">"From" must be before "To"</span>
            <span *ngSwitchCase="'error'">Archive service unavailable</span>
        </ng-container>
    </div>

    <button type="submit" class="ph-btn ph-btn--primary load-btn" [disabled]="!canLoad">
        <mat-icon>download</mat-icon>Load data
    </button>
</form>
