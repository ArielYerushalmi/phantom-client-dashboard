<ngx-charts-line-chart class="graph" id="{{entity.parameter.parameterName}}"
    [results]="graphValues"

    [scheme]="colorScheme"
    [gradient]="gradient"
    [xAxis]="showXAxis"
    [yAxis]="showYAxis"
    [legend]="showLegend"
    [showXAxisLabel]="showXAxisLabel"
    [showYAxisLabel]="showYAxisLabel"
    [xAxisLabel]="'Time'"
    [yAxisLabel]="entity.parameter.units"
    [legendTitle]="false"

    [autoScale]="true"
    [animations]="true"
    [xAxisTickFormatting]="formatTime"
    style="fill: white">
</ngx-charts-line-chart>
