<ngx-charts-line-chart class="graph"
    [results]="graphValues"

    [scheme]="colorScheme"
    [gradient]="gradient"
    [rangeFillOpacity]="0.18"
    [xAxis]="showXAxis"
    [yAxis]="showYAxis"
    [legend]="showLegend"
    [showXAxisLabel]="showXAxisLabel"
    [showYAxisLabel]="showYAxisLabel"
    [xAxisLabel]="'Time'"
    [yAxisLabel]="parameter?.units"
    [legendTitle]="false"
    [roundDomains]="true"

    [autoScale]="true"
    [animations]="false"
    [xAxisTickFormatting]="formatTime">
</ngx-charts-line-chart>
