<div class="scrubber" [class.disabled]="disabled" [class.is-dragging]="isDragging" [class.is-playing]="isPlaying">
    <div class="transport" role="group" aria-label="Playback">
        <button type="button" class="tx" (click)="jumpToStart()" [disabled]="disabled" aria-label="Jump to start" title="Jump to start (Home)">
            <svg viewBox="0 0 16 16"><path d="M4 3v10M12.5 3.5 6 8l6.5 4.5z" /></svg>
        </button>
        <button type="button" class="tx" (click)="stepBack()" [disabled]="disabled" aria-label="Step back" title="Step back (←)">
            <svg viewBox="0 0 16 16"><path d="M10.5 3.5 5 8l5.5 4.5" /></svg>
        </button>
        <button type="button" class="tx tx--play" (click)="togglePlay()" [disabled]="disabled"
            [attr.aria-label]="isPlaying ? 'Pause' : 'Play'" [attr.aria-pressed]="isPlaying" title="Play / pause (Space)">
            <svg *ngIf="!isPlaying" viewBox="0 0 16 16"><path d="M5 3.2v9.6L12.6 8z" /></svg>
            <svg *ngIf="isPlaying" viewBox="0 0 16 16"><path d="M5.5 3.5v9M10.5 3.5v9" /></svg>
        </button>
        <button type="button" class="tx" (click)="stepForward()" [disabled]="disabled" aria-label="Step forward" title="Step forward (→)">
            <svg viewBox="0 0 16 16"><path d="M5.5 3.5 11 8l-5.5 4.5" /></svg>
        </button>
        <button type="button" class="tx" (click)="jumpToEnd()" [disabled]="disabled" aria-label="Jump to end" title="Jump to end (End)">
            <svg viewBox="0 0 16 16"><path d="M12 3v10M3.5 3.5 10 8l-6.5 4.5z" /></svg>
        </button>
        <button type="button" class="tx tx--speed telemetry-value" (click)="cycleSpeed()" [disabled]="disabled"
            [attr.aria-label]="'Playback speed ' + speed + 'x'" title="Playback speed">{{ speed }}×</button>
    </div>

    <div class="timeline">
        <div class="ticks" aria-hidden="true">
            <span class="tick" *ngFor="let t of ticks" [style.left.%]="t.pct">{{ t.label }}</span>
        </div>

        <div #track class="track" (pointerdown)="onTrackPointerDown($event)" (pointermove)="onTrackPointerMove($event)"
            (pointerup)="onTrackPointerUp($event)" (pointercancel)="onTrackPointerUp($event)"
            (pointerleave)="onTrackPointerLeave()">
            <div class="rail">
                <div class="rail-fill" [style.transform]="'scaleX(' + playheadPct / 100 + ')'"></div>
            </div>
            <div class="minor-ticks" aria-hidden="true"></div>
            <div class="window-band" *ngIf="windowMs && currentValue" [style.left.%]="bandLeftPct"
                [style.width.%]="bandWidthPct"></div>

            <div class="hover-rail" *ngIf="hoverPct !== null" [style.transform]="'translateX(' + hoverPct + '%)'"
                aria-hidden="true">
                <div class="hover-line"></div>
                <div class="hover-label telemetry-value">{{ hoverLabel }}</div>
            </div>

            <div class="playhead-rail" *ngIf="currentValue" [style.transform]="'translateX(' + playheadPct + '%)'">
                <div class="playhead-line"></div>
                <div class="playhead-bubble telemetry-value">{{ playheadLabel }}</div>
                <div class="playhead-handle" tabindex="0" role="slider" aria-label="Scrub position"
                    [attr.aria-valuemin]="rangeStart?.getTime()" [attr.aria-valuemax]="rangeEnd?.getTime()"
                    [attr.aria-valuenow]="currentValue?.getTime()" [attr.aria-valuetext]="playheadLabel"
                    (keydown)="onHandleKeydown($event)"></div>
            </div>
        </div>
    </div>

    <div class="empty-hint" *ngIf="disabled">Set a time range to enable the scrubber.</div>
</div>
