<header class="command-bar">
  <a class="command-bar-brand" routerLink="/home">
    <span class="brand-word">PHANTOM</span>
  </a>

  <nav class="channel-strip" aria-label="Primary">
    <a *ngFor="let channel of channels" class="channel" [routerLink]="[channel.path]" routerLinkActive="channel-active">
      {{ channel.label }}
    </a>
  </nav>

  <div class="command-bar-status" [ngClass]="connectionActive ? 'is-live' : 'is-offline'"
    title="Live telemetry connection status">
    <span class="status-dot"></span>
    <span class="status-text">{{ connectionLabel }}</span>
  </div>

  <div class="command-bar-session">
    <span class="session-user" *ngIf="username">{{ username }}</span>
    <button type="button" class="session-logout" (click)="logout()">Logout</button>
  </div>
</header>
